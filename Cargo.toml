[package]
name = "botsitter"
version = "0.1.0"
edition = "2021"
description = "Rate-limit-aware wrapper for Claude Code and the Codex CLI"
license = "MIT"
repository = "https://github.com/adrien2121/botsitter"
readme = "README.md"
keywords = ["cli", "claude", "codex", "rate-limit"]
categories = ["command-line-utilities"]
exclude = [
    ".agents/",
    ".codex/",
    ".serena/",
    ".tokensave/",
    "AGENTS.md",
    "BACKLOG.md",
    "docs/",
]


[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
crossterm = "0.27"
dirs = "5.0"
tokio = { version = "1", features = ["full"] }
portable-pty = "0.8"
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "6.1.1"
keepawake = "0.6.0"
memchr = "2.7.2"
memmap2 = "0.9"

[target."cfg(unix)".dependencies]
signal-hook = "0.4.4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
